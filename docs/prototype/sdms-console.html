<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>空间数据管理控制台 · 高保真原型</title>
<style>
:root{
  --primary:#1163b5; --primary-600:#0d5099; --primary-050:#eaf3fc; --primary-100:#d5e7f8;
  --ink:#16202c; --ink-2:#4b5c6e; --ink-3:#7d90a3;
  --line:#e3e9f0; --line-2:#ccd8e4;
  --bg:#f3f6fa; --panel:#fff; --panel-2:#f8fafc;
  --ok:#1a9c78; --warn:#c07d16; --danger:#cf4438; --violet:#6b57d2;
  --r:8px; --r-s:5px;
  --sh:0 1px 2px rgba(16,42,72,.06),0 1px 3px rgba(16,42,72,.05);
  --sh-2:0 10px 28px rgba(16,42,72,.12);
  --top-h:54px; --nav-w:228px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.55 "Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:13px;color:inherit}
a{color:var(--primary);text-decoration:none}
code{font-family:Consolas,Menlo,monospace;font-size:11.5px;background:#f0f4f9;padding:1px 4px;border-radius:3px;color:#2a4d6e}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c6d2de;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#a8b8c8;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ================= 顶栏 ================= */
.topbar{height:var(--top-h);display:flex;align-items:center;gap:14px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:40}
.brand{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.brand .logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#1163b5,#2b8fd8);display:grid;place-items:center;box-shadow:0 1px 4px rgba(17,99,181,.35)}
.brand .logo svg{width:16px;height:16px}
.brand .env{font-size:10.5px;font-weight:600;color:#1a7a5e;background:#eafaf4;border:1px solid #bfe6d8;border-radius:10px;padding:0 7px;line-height:16px}

.gsearch{flex:0 1 430px;display:flex;align-items:center;gap:8px;height:32px;border:1px solid var(--line-2);border-radius:16px;padding:0 12px;background:var(--panel-2);transition:.15s}
.gsearch:focus-within{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(17,99,181,.10)}
.gsearch svg{width:14px;height:14px;color:var(--ink-3);flex:0 0 14px}
.gsearch input{flex:1;border:0;outline:none;background:transparent;font-size:12.5px}
.gsearch .kbd{font-size:10.5px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:4px;padding:0 4px;background:#fff}

.tb-sp{flex:1}
.tb-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--line-2);border-radius:var(--r-s);background:#fff;color:var(--ink-2);cursor:pointer;font-size:12.5px;transition:.14s;white-space:nowrap}
.tb-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-050)}
.tb-btn svg{width:13px;height:13px}
.tb-btn.on{background:var(--primary);border-color:var(--primary);color:#fff}
.tb-user{display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid var(--line);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.tb-user .avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#2b8fd8,#1a9c78);color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:600}

/* ================= 壳 ================= */
.shell{display:flex;height:calc(100% - var(--top-h))}

/* 侧栏 */
.sidenav{width:var(--nav-w);flex:0 0 var(--nav-w);background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:8px 0 20px}
.nav-cap{padding:12px 16px 6px;font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:1.4px}
.nav-grp{display:flex;align-items:center;gap:8px;padding:9px 14px 6px;color:var(--ink);font-size:12.5px;font-weight:700;user-select:none;cursor:pointer}
.nav-grp .ico{width:15px;height:15px;color:var(--ink-3)}
.nav-grp .cv{margin-left:auto;font-size:9px;color:var(--ink-3);transition:.18s}
.nav-grp.closed .cv{transform:rotate(-90deg)}
.nav-kids{overflow:hidden}
.nav-kids.closed{display:none}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 36px;cursor:pointer;color:var(--ink-2);font-size:12.5px;border-left:2.5px solid transparent;transition:.13s;user-select:none;position:relative}
.nav-item:hover{background:var(--panel-2);color:var(--primary)}
.nav-item.active{background:var(--primary-050);color:var(--primary);border-left-color:var(--primary);font-weight:600}
.nav-item .nb{margin-left:auto;font-size:10.5px;color:var(--ink-3);background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:0 6px;line-height:15px}
.nav-item.active .nb{background:#fff;border-color:#bcd9f2;color:var(--primary)}

/* 工作区 */
.workspace{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.crumb{height:40px;display:flex;align-items:center;gap:7px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-3);flex:0 0 auto}
.crumb b{color:var(--ink);font-weight:600}
.crumb .sep{color:#c6d2de}
.crumb .ref{margin-left:8px;font-size:10.5px;color:#6b57d2;background:#f1eefc;border:1px solid #ddd6f7;border-radius:10px;padding:0 8px;line-height:17px}
.crumb .hint{margin-left:auto;color:var(--ink-3);font-size:11.5px}
.view{flex:1;overflow:auto;padding:12px 14px 20px}

/* ================= 通用控件 ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:30px;padding:0 12px;border-radius:var(--r-s);border:1px solid var(--line-2);background:#fff;color:var(--ink-2);cursor:pointer;font-size:12.5px;transition:.14s;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-050)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-600);border-color:var(--primary-600);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.sm{height:25px;padding:0 9px;font-size:12px}
.btn.xs{height:22px;padding:0 7px;font-size:11.5px;border-radius:4px}
.btn.danger{color:var(--danger);border-color:#eec9c5}
.btn.danger:hover{background:#fdf1f0;border-color:var(--danger);color:var(--danger)}
.btn.ok{color:var(--ok);border-color:#bfe6d8}
.btn.ok:hover{background:#eafaf4;border-color:var(--ok);color:var(--ok)}
.btn svg{width:13px;height:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.input,.select,textarea.input{height:30px;padding:0 9px;border:1px solid var(--line-2);border-radius:var(--r-s);background:#fff;outline:none;transition:.14s;min-width:0;width:100%}
textarea.input{height:auto;padding:6px 9px;resize:vertical;line-height:1.5}
.input:focus,.select:focus,textarea.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(17,99,181,.10)}
.field{display:flex;align-items:center;gap:7px;min-width:0}
.field label{color:var(--ink-2);font-size:12.5px;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:3px;padding:0 7px;border-radius:9px;font-size:11px;line-height:17px;border:1px solid;white-space:nowrap}
.tag.blue{color:#0d5099;background:#eaf3fc;border-color:#c8dff5}
.tag.green{color:#14775c;background:#eafaf4;border-color:#bfe6d8}
.tag.orange{color:#99600d;background:#fdf4e3;border-color:#f0dcb4}
.tag.gray{color:#5d6f80;background:#f1f4f8;border-color:#e3e9f0}
.tag.red{color:#a83a30;background:#fdf1f0;border-color:#f2d2ce}
.tag.violet{color:#4b3bb0;background:#f1eefc;border-color:#ddd6f7}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex:0 0 6px}
.dot.g{background:#1a9c78}.dot.o{background:#c07d16}.dot.r{background:#cf4438}.dot.b{background:#1163b5}.dot.n{background:#a8b8c8}

/* ================= 页面骨架 ================= */
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:16px;font-weight:700;letter-spacing:.2px}
.page-head .sub{color:var(--ink-3);font-size:12px}
.page-head .tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink)}
.card-h .tools{margin-left:auto;display:flex;gap:5px;align-items:center}
.card-h .cnt{font-size:11px;font-weight:600;color:var(--ink-3);background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:0 7px;line-height:16px}
.card-b{padding:13px}

/* 筛选条 */
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 0 10px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 11px;border:1px solid var(--line-2);background:#fff;border-radius:14px;font-size:12px;color:var(--ink-2);cursor:pointer;transition:.14s}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.chip .x{font-size:13px;opacity:.7}

/* 三栏工作区 */
.work{display:flex;gap:12px;align-items:flex-start;min-height:560px}
.col-tree{flex:0 0 236px;position:sticky;top:0}
.col-main{flex:1;min-width:0}
.col-detail{flex:0 0 412px}
.work.full .col-tree,.work.full .col-main{display:none}
.work.full .col-detail{flex:1}

/* 目录树 */
.tree-search{display:flex;gap:5px;padding:3px 10px 9px}
.tree-search .input{height:28px}
.tree-scroll{max-height:calc(100vh - 300px);overflow:auto;padding:0 5px 10px}
.tnode{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:5px;cursor:pointer;font-size:12.5px;color:var(--ink-2);user-select:none}
.tnode:hover{background:var(--panel-2)}
.tnode.sel{background:var(--primary-050);color:var(--primary);font-weight:600}
.tnode .cv{width:11px;flex:0 0 11px;font-size:9px;color:var(--ink-3);transition:.15s}
.tnode .cv.closed{transform:rotate(-90deg)}
.tnode .ti{width:14px;height:14px;flex:0 0 14px;color:#8fa4b8}
.tnode.sel .ti{color:var(--primary)}
.tnode .tc{margin-left:auto;font-size:10.5px;color:var(--ink-3)}
.tkids{margin-left:13px;border-left:1px dashed var(--line-2);padding-left:3px}
.tkids.closed{display:none}

/* 工具栏 */
.bar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-s);overflow:hidden}
.seg button{height:26px;padding:0 10px;border:0;background:#fff;color:var(--ink-2);cursor:pointer;font-size:12px;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--primary);color:#fff;font-weight:600}

/* 资源卡片 */
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:11px}
.res{position:relative;display:flex;gap:11px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px;cursor:pointer;transition:.15s}
.res:hover{border-color:#a9cbe8;box-shadow:0 4px 14px rgba(17,99,181,.10);transform:translateY(-1px)}
.res.sel{border-color:var(--primary);box-shadow:0 0 0 3px rgba(17,99,181,.12)}
.res .cb{position:absolute;top:9px;right:9px;width:15px;height:15px;accent-color:var(--primary);cursor:pointer}
.res .thumb{width:74px;height:62px;flex:0 0 74px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#e8eff6;position:relative}
.res .thumb svg{width:100%;height:100%;display:block}
.res .thumb .k{position:absolute;left:0;bottom:0;right:0;font-size:9.5px;color:#fff;background:linear-gradient(0deg,rgba(10,40,70,.78),transparent);padding:6px 4px 2px;text-align:center;letter-spacing:.5px}
.res .bd{flex:1;min-width:0}
.res .tt{font-size:12.8px;font-weight:700;color:#0e4e88;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:16px}
.res .tt:hover{text-decoration:underline}
.res .chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px}
.res .rows{display:grid;grid-template-columns:1fr;gap:2px;font-size:11.5px;color:var(--ink-2)}
.res .rows span b{color:var(--ink-3);font-weight:400}

/* 表格视图 */
.tbl-wrap{overflow:auto;max-height:calc(100vh - 268px)}
table.grid{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;white-space:nowrap}
table.grid th{background:var(--panel-2);color:var(--ink-2);font-weight:600;position:sticky;top:0;z-index:2;font-size:12px}
table.grid tbody tr{cursor:pointer;transition:.1s}
table.grid tbody tr:hover{background:var(--primary-050)}
table.grid tbody tr.sel{background:var(--primary-050);box-shadow:inset 3px 0 0 var(--primary)}
table.grid td .cellname{color:#0e4e88;font-weight:600}
.mini{width:100%;border-collapse:collapse;font-size:12px}
.mini th,.mini td{border:1px solid var(--line);padding:5px 8px;text-align:left}
.mini th{background:var(--panel-2);font-weight:600;color:var(--ink-2);font-size:11.5px}
.mini input,.mini select{width:100%;border:0;outline:none;background:transparent;padding:2px 3px;font-size:12px}
.mini input:focus{background:#fffbe8}

/* 分页 */
.pager{display:flex;align-items:center;gap:7px;padding:9px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2);background:#fff;border-radius:0 0 var(--r) var(--r)}
.pager .sp{flex:1}
.pager button{min-width:27px;height:27px;border:1px solid var(--line-2);background:#fff;border-radius:4px;cursor:pointer;color:var(--ink-2)}
.pager button.act{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.pager button[disabled]{opacity:.45;cursor:not-allowed}

/* ================= 资源详情（页签） ================= */
.drawer{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.drawer.empty{align-items:center;justify-content:center;min-height:560px;color:var(--ink-3);font-size:12.5px;text-align:center;gap:8px}
.drawer.empty svg{width:38px;height:38px;color:#c6d5e2}
.dw-h{padding:12px 14px 0}
.dw-top{display:flex;align-items:flex-start;gap:9px}
.dw-top .tt{font-size:14px;font-weight:700;color:var(--ink);line-height:1.35;flex:1;min-width:0;word-break:break-all}
.dw-top .x{border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:17px;line-height:1;padding:2px 4px;border-radius:4px}
.dw-top .x:hover{background:var(--panel-2);color:var(--danger)}
.dw-meta{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0 9px}
.dw-tabs{display:flex;gap:1px;border-bottom:1px solid var(--line);overflow-x:auto;padding:0 14px}
.dw-tabs button{border:0;background:none;border-bottom:2px solid transparent;padding:8px 9px;cursor:pointer;color:var(--ink-2);font-size:12.5px;white-space:nowrap}
.dw-tabs button:hover{color:var(--primary)}
.dw-tabs button.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}
.dw-b{overflow:auto;padding:13px 14px 16px;max-height:calc(100vh - 262px)}
.sec{margin-bottom:14px}
.sec-t{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.8px;margin:0 0 7px;display:flex;align-items:center;gap:6px}
.sec-t::before{content:"";width:3px;height:11px;border-radius:2px;background:var(--primary);display:inline-block}
.kv{display:grid;grid-template-columns:82px 1fr;gap:6px 10px;font-size:12px;margin:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;color:var(--ink);word-break:break-all}
.ramp{display:flex;height:16px;border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.ramp i{flex:1}
.bar-mini{height:6px;border-radius:3px;background:#e8eef5;overflow:hidden}
.bar-mini i{display:block;height:100%;background:linear-gradient(90deg,#3d9bd6,#1a9c78)}
.svc-line{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;background:var(--panel-2);font-size:12px}
.svc-line b{font-family:Consolas,monospace;font-size:11.5px;color:#0e4e88}
.act-item{display:flex;gap:9px;font-size:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.act-item:last-child{border-bottom:0}
.act-item .t{color:var(--ink-3);flex:0 0 108px;font-size:11.5px}
.hint{font-size:11.5px;color:var(--ink-3);line-height:1.6;margin-top:6px}
.hint.warn{color:#a8690d}

/* ================= 地图 ================= */
.mapstage{display:flex;gap:12px;align-items:stretch;min-height:600px}
.toc{flex:0 0 264px;display:flex;flex-direction:column}
.toc-scroll{flex:1;overflow:auto;padding:6px 8px}
.lyr{display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:5px;cursor:pointer;font-size:12.5px;color:var(--ink-2);user-select:none}
.lyr:hover{background:var(--panel-2)}
.lyr.sel{background:var(--primary-050);color:var(--primary)}
.lyr .cb{accent-color:var(--primary);cursor:pointer;flex:0 0 auto}
.lyr .gr{color:#c6d2de;font-size:11px;cursor:grab}
.lyr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lyr .op{opacity:0;font-size:11px;color:var(--ink-3);transition:.15s}
.lyr:hover .op{opacity:1}
.lyr .sw{width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.15);flex:0 0 13px}
.mapbox{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.mapbar{display:flex;align-items:center;gap:3px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel-2);flex-wrap:wrap}
.mbtn{width:29px;height:29px;display:grid;place-items:center;border:1px solid transparent;border-radius:5px;background:transparent;cursor:pointer;color:var(--ink-2);transition:.14s}
.mbtn:hover{background:#fff;border-color:var(--line-2);color:var(--primary)}
.mbtn.on{background:var(--primary);border-color:var(--primary);color:#fff}
.mbtn svg{width:15px;height:15px}
.mapcanvas{position:relative;flex:1;min-height:430px;background:#e6edf4;overflow:hidden}
.mapcanvas svg.base{position:absolute;inset:0;width:100%;height:100%}
.mapov{position:absolute;inset:0;pointer-events:none}
.mapfoot{display:flex;align-items:center;gap:12px;padding:5px 10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);background:#fff}
.mapfoot .sp{flex:1}
.mapleg{position:absolute;right:10px;bottom:36px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:11px;color:var(--ink-2);box-shadow:var(--sh);max-width:180px}
.mapleg .li{display:flex;align-items:center;gap:6px;margin-top:4px}
.mapleg i{width:14px;height:10px;border-radius:2px;border:1px solid rgba(0,0,0,.12);flex:0 0 14px}
.mapscale{position:absolute;left:12px;bottom:10px;font-size:11px;color:#33475c;background:rgba(255,255,255,.85);padding:1px 7px;border-radius:3px}
.insp{flex:0 0 268px;display:flex;flex-direction:column}
.insp .card-b{padding:11px 12px;max-height:calc(100vh - 250px);overflow:auto}

/* ================= 任务 / 进度 ================= */
.prg{height:7px;border-radius:4px;background:#e8eef5;overflow:hidden;position:relative}
.prg i{display:block;height:100%;background:linear-gradient(90deg,#3d9bd6,#1a9c78);transition:width .4s}
.steps{display:flex;gap:7px;margin:12px 0}
.step{flex:1;text-align:center;padding:7px 4px;border-radius:6px;background:var(--panel-2);color:var(--ink-3);border:1px solid var(--line);font-size:11.5px;line-height:1.35}
.step.done{background:#eafaf4;color:#14775c;border-color:#bfe6d8}
.step.now{background:var(--primary-050);color:var(--primary);border-color:#c8dff5;font-weight:700}
.qtask{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;font-size:12px;background:#fff}
.qtask .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ================= 工具箱 ================= */
.toolbox{display:flex;gap:12px;align-items:flex-start;min-height:560px}
.tool-cat{flex:0 0 218px}
.tool-cat .grp{font-size:11.5px;font-weight:700;color:var(--ink-3);padding:9px 12px 5px;letter-spacing:.6px}
.tool-i{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:12.5px;color:var(--ink-2);border-left:2.5px solid transparent}
.tool-i:hover{background:var(--panel-2);color:var(--primary)}
.tool-i.on{background:var(--primary-050);color:var(--primary);border-left-color:var(--primary);font-weight:700}
.tool-i .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-i .badge{flex:0 0 auto;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Consolas,monospace;font-size:10px;color:#8fa4b8}
.tool-form{flex:1;min-width:340px}
.tool-side{flex:0 0 282px;display:flex;flex-direction:column;gap:12px}
.tool-side .card+.card{margin-top:0}
.form-row{display:grid;grid-template-columns:112px minmax(0,1fr);gap:10px;align-items:start;margin-bottom:11px}
.form-row > label{text-align:right;color:var(--ink-2);font-size:12.5px;padding-top:7px}
.form-row > .select,.form-row > .input,.form-row > div{align-self:start}
.tool-form .form-row{grid-template-columns:112px minmax(0,520px)}
.form-row .req{color:var(--danger)}
.form-row .full{grid-column:1/-1}
.form-sec{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.8px;margin:4px 0 10px;padding-bottom:5px;border-bottom:1px dashed var(--line)}

/* ================= 弹窗 ================= */
.mask{position:fixed;inset:0;background:rgba(14,34,56,.44);display:grid;place-items:center;z-index:100;animation:fd .16s ease}
@keyframes fd{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:10px;width:580px;max-width:93vw;max-height:89vh;display:flex;flex-direction:column;box-shadow:var(--sh-2);animation:pp .18s ease}
@keyframes pp{from{transform:translateY(10px) scale(.985);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px;font-weight:700}
.modal-h .x{margin-left:auto;cursor:pointer;color:var(--ink-3);font-size:19px;line-height:1;background:none;border:0;padding:0 3px}
.modal-h .x:hover{color:var(--danger)}
.modal-b{padding:16px;overflow:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:11px 16px;border-top:1px solid var(--line);background:var(--panel-2);border-radius:0 0 10px 10px}
.dropzone{border:1.5px dashed var(--line-2);border-radius:8px;padding:18px;text-align:center;color:var(--ink-2);background:var(--panel-2);cursor:pointer;transition:.15s}
.dropzone:hover{border-color:var(--primary);background:var(--primary-050)}
.dropzone svg{width:26px;height:26px;color:var(--primary);margin-bottom:6px}
.pick{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;margin-bottom:6px}
.pick .fi{flex:1;min-width:0}
.pick .nm{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .sz{font-size:11.5px;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(18,40,64,.94);color:#fff;padding:10px 18px;border-radius:7px;font-size:12.5px;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.28);max-width:80vw}

/* ================= 接口注释层 ================= */
body:not(.api-on) .api-badge{display:none}
body:not(.api-on) .api-el{outline:none !important}
body.api-on .api-el{position:relative;outline:1px dashed rgba(17,99,181,.5);outline-offset:2px;border-radius:4px}
body.api-on .api-el[data-m="GET"]{outline-color:rgba(26,156,120,.62)}
body.api-on .api-el[data-m="POST"]{outline-color:rgba(17,99,181,.55)}
body.api-on .api-el[data-m="DELETE"]{outline-color:rgba(207,68,56,.6)}
body.api-on .api-el[data-m="PUT"]{outline-color:rgba(192,125,22,.6)}
.api-badge{position:absolute;top:-7px;right:-6px;z-index:14;min-width:16px;height:16px;line-height:16px;text-align:center;border-radius:8px;padding:0 3.5px;background:#1163b5;color:#fff;font:700 9.5px/16px Consolas,Menlo,monospace;font-style:normal;cursor:pointer;box-shadow:0 1px 4px rgba(12,40,70,.35);border:1px solid #fff;user-select:none}
body.api-on .api-el[data-m="GET"] .api-badge{background:#1a9c78}
body.api-on .api-el[data-m="DELETE"] .api-badge{background:#cf4438}
body.api-on .api-el[data-m="PUT"] .api-badge{background:#c07d16}
.api-badge:hover{transform:scale(1.16)}
.api-dock{position:fixed;right:16px;bottom:16px;width:452px;max-height:66vh;background:#fff;border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--sh-2);z-index:90;display:none;flex-direction:column;overflow:hidden}
.api-dock.show{display:flex}
.api-dock-h{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px;background:var(--panel-2)}
.api-dock-h .x{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:17px}
.api-dock-b{overflow:auto;padding:10px 12px}
.api-item{border:1px solid var(--line);border-radius:7px;padding:9px 11px;margin-bottom:8px;background:#fff}
.api-item .hd{display:flex;align-items:center;gap:7px;font-family:Consolas,Menlo,monospace;font-size:12px}
.api-item .m{font-weight:700;padding:0 5px;border-radius:3px;color:#fff;font-size:10.5px}
.api-item .m.GET{background:#1a9c78}.api-item .m.POST{background:#1163b5}.api-item .m.DELETE{background:#cf4438}.api-item .m.PUT{background:#c07d16}
.api-item .d{font-size:12px;color:var(--ink-2);margin-top:5px}
.api-item .k{font-size:11.5px;color:var(--ink-3);margin-top:4px;font-family:Consolas,Menlo,monospace;word-break:break-all;line-height:1.5}
.api-item .note{font-size:11.5px;color:#a83a30;margin-top:4px}
.api-legend{display:none;align-items:center;gap:9px;font-size:11.5px;color:var(--ink-3)}
body.api-on .api-legend{display:inline-flex}
.api-legend b{font:700 10px/14px Consolas,monospace;color:#fff;padding:0 4px;border-radius:3px}
.empty{padding:56px 20px;text-align:center;color:var(--ink-3);font-size:12.5px}
.empty svg{width:40px;height:40px;color:#c6d5e2;display:block;margin:0 auto 10px}
.footnote{padding:14px 4px 0;color:var(--ink-3);font-size:11.5px;line-height:1.7}
</style>
</head>

<script>
/* =========================================================================
 * API 注册表 —— 逐条核对自 docs/接口文档.md（20 Controller / 200 端点）
 * key -> { m 方法, p 路径, d 说明, q 入参, r 返回, n 注意事项 }
 * ========================================================================= */
const API = {
  /* ---- 图层内容 / 目录 ---- */
  layerTree:{m:'GET',p:'/layerContent/getLayerTree',d:'加载左侧资源目录树（按分类维度组织）',
    q:'dictType(必填)、dataType、publishStatus(默认"")、layerName(默认"")、uploadFileType(默认"")、maxRaster、isclassify',
    r:'Result<String> — List<CatalogTreeVO> 压缩后的字符串',n:'⚠️ 返回压缩串，前端须先解压再 JSON.parse'},
  layerTreeByType:{m:'GET',p:'/layerContent/getLayerTreeByType',d:'按分类节点加载子树',
    q:'dataTypeId、publishStatus、layerName',r:'Result<String> 压缩串',n:'⚠️ 同 getLayerTree'},
  layerAllList:{m:'GET',p:'/layerContent/GetAllList',d:'全量图层（导出 / 统计用）',q:'—',r:'Result<List<LayerContentDto>>'},
  layerFilterList:{m:'POST',p:'/layerContent/GetAllListByName',d:'条件查询资源列表（不分页）',q:'Body: LayerContentInputDto',
    r:'裸返回 ListResultOutput<LayerContentDto>',n:'⚠️ 裸返回；字段名是单数 item 而非 items'},
  layerPage:{m:'POST',p:'/layerContent/GetPageListByName',d:'资源列表分页查询（筛选器 / 分页条）',
    q:'Query: pageSize(默认10)、pageIndex(默认1)；Body: LayerContentInputDto',
    r:'裸返回 PagedResultOutput<LayerContentDto>{totalCount,items}',n:'⚠️ 无 Result 外壳，直接取 totalCount / items'},
  layerCount:{m:'GET',p:'/layerContent/GetAllCount',d:'资源总数（导航角标）',q:'userCode',r:'裸返回 Integer',n:'⚠️ 裸返回'},
  layerCntByType:{m:'GET',p:'/layerContent/GetAllCountByDataType',d:'按分类统计资源数（目录树计数）',q:'userCode',r:'Result<...>'},
  layerByMap:{m:'GET',p:'/layerContent/GetAllListByMapID',d:'按地图取图层清单',q:'mapID',r:'裸返回 ListResultOutput<LayerContentDto>',n:'⚠️ 裸返回'},
  layerDetail:{m:'GET',p:'/layerContent/GetDetailById',d:'资源详情（打开右侧详情页签）',q:'id(图层ID)',r:'Result<LayerContentDto>'},
  layerInsert:{m:'POST',p:'/layerContent/Insert',d:'【新建资源】提交入库',
    q:'Query: filePathName、user、isImport；Body: LayerContentInputDto',r:'Result<LayerContentDto>'},
  layerInsertImage:{m:'POST',p:'/layerContent/InsertImageLayer',d:'新建影像图层',q:'LayerContentInputDto（表单绑定）',
    r:'裸返回 MapEntity',n:'⚠️ 无 @RequestBody，走 form 表单；裸返回'},
  layerUpdate:{m:'POST',p:'/layerContent/Update',d:'【保存】资源属性',q:'Body: LayerContentInputDto',r:'Result<Boolean>'},
  layerUpdateStatus:{m:'POST',p:'/layerContent/UpdateStatus',d:'上传完成后置 uploadStatus=1',q:'layerID',r:'Result<LayerContentDto>'},
  layerDelete:{m:'POST',p:'/layerContent/Delete',d:'【删除】资源',q:'id、user',r:'裸返回 boolean',n:'⚠️ 裸返回；连带清理发布信息请用 DeleteLayer'},
  layerDeleteLayer:{m:'POST',p:'/layerContent/DeleteLayer',d:'删除资源并连带清理发布信息',q:'id',r:'裸返回 boolean'},
  layerSort:{m:'POST',p:'/layerContent/updateList',d:'目录树拖拽排序 / 批量归档',q:'Body: List<LayerUpdateDto>{id,parentId,type,sort}',r:'Result<Boolean>'},
  layerValue:{m:'GET',p:'/layerContent/getLayerValue',d:'地图点选：取该位置要素值',q:'layerId、longitude、latitude',r:'Result<Object>（无值返回空串）'},
  layerAttrDetail:{m:'GET',p:'/layerContent/GetLayerAttrTabledDetail',d:'属性表结构明细',q:'layerID、pageSize、pageIndex',r:'裸返回 String',n:'⚠️ 裸返回'},

  /* ---- 属性表 / 字段 / 空间查询 ---- */
  attrTable:{m:'GET',p:'/layerContent/GetAttrtableByLayerId',d:'属性表分页读取',q:'layerId、PageSize(大写)、PageIndex(大写)',
    r:'裸返回 PagedResultOutput<String>',n:'⚠️ 裸返回；分页参数为大写 PageSize / PageIndex'},
  attrWhere:{m:'GET',p:'/layerContent/GetLayerAttrTableByWhere',d:'按 where 条件读属性表',q:'layerId、where、pageSize、pageIndex',r:'裸返回 PagedResultOutput<String>'},
  attrInsert:{m:'POST',p:'/layerContent/InsertAttrtable',d:'新增要素记录',q:'Body: LayerParameter{id,attrtable}',r:'裸返回 boolean'},
  attrUpdate:{m:'POST',p:'/layerContent/UpdateAttrtable',d:'修改要素记录',q:'Body: LayerParameter',r:'Result<Boolean>'},
  attrUpdateList:{m:'POST',p:'/layerContent/UpdateAttrtableList',d:'批量修改要素记录',q:'Body: List<LayerParameter>',r:'Result<Boolean>'},
  attrDelete:{m:'POST',p:'/layerContent/DeleteAttrtable',d:'删除要素记录',q:'id、gid',r:'裸返回 boolean'},
  attrSwitch:{m:'POST',p:'/layerContent/pageAttrInfoBySwitch',d:'空间查询：圆选 / 多边选 / 框选 / 缓冲区 / SQL 五种模式',
    q:'Body: LayerFieldQuery{layerId,where[],wkt,distance,lon,lat,layerIds} + pageSize + pageIndex',r:'Result<PageResultDTO<Map>>'},
  attrPoint:{m:'POST',p:'/layerContent/pageAttrInfoByPoint',d:'地图点选查询',q:'Body: LayerFieldQuery',r:'Result<List<PageResultDTO<Map>>>'},
  attrDownload:{m:'POST',p:'/layerContent/downloadAttrInfoBySwitch',d:'导出查询结果',q:'Body: LayerFieldQuery',r:'Result<String> — MinIO 下载 URL'},
  downloadTif:{m:'GET',p:'/layerContent/downloadTif',d:'下载栅格原始文件',q:'layerId(小写 id)',r:'Result<String> — MinIO 下载 URL'},
  fieldByLayer:{m:'GET',p:'/layerContent/GetFieldByLayerId',d:'取图层字段定义（字段页签）',q:'layerId、attributeType',r:'裸返回 List<LayerFieldEntity>'},
  validateCond:{m:'POST',p:'/layerContent/ValidateCondition',d:'校验查询条件合法性',q:'layerId + Body List<JSONObject>',r:'裸返回 boolean'},
  outputShp:{m:'GET',p:'/layerContent/OutputShpFileData',d:'导出 SHP 本地文件',q:'layerID(大写 ID)',r:'Result<String> 本地路径',n:'⚠️ 与 downloadTif 的 layerId 大小写不同名'},
  outputTif:{m:'GET',p:'/layerContent/OutputTifFileData',d:'导出 TIF 本地文件',q:'layerID(大写 ID)',r:'Result<String> 本地路径'},
  editFeatures:{m:'POST',p:'/layerContent/editVectorFeatures',d:'矢量要素编辑保存（GeoJSON）',q:'Body: VectorEditDTO{layerId,geoJsonCollection}',r:'Result<Boolean>'},

  /* ---- 图层字段 ---- */
  fieldList:{m:'GET',p:'/layerField/GetDetailByLayerID',d:'字段列表',q:'layerID',r:'裸返回 ListResultOutput<LayerFieldDto>'},
  fieldAll:{m:'GET',p:'/layerField/GetAllList',d:'全量字段',q:'—',r:'裸返回 ListResultOutput<LayerFieldDto>'},
  fieldInsert:{m:'POST',p:'/layerField/Insert',d:'【新增字段】',q:'Body: LayerFieldInputDto',r:'Result<...>'},
  fieldMultiInsert:{m:'POST',p:'/layerField/MultiInsert',d:'批量新增字段',q:'Body: List<LayerFieldInputDto>',r:'Result<...>'},
  fieldUpdate:{m:'POST',p:'/layerField/Update',d:'编辑字段',q:'Body: LayerFieldInputDto',r:'Result<...>'},
  fieldDelete:{m:'POST',p:'/layerField/Delete',d:'删除字段',q:'id',r:'Result<...>'},

  /* ---- 图层工具（异步，统一返回 taskId） ---- */
  toolList:{m:'GET',p:'/layerTool/getList',d:'任务中心：异步任务历史 / 轮询状态',q:'pageSize、pageIndex、origin(按工具类型过滤)',r:'Result<IPage<ToolHisEntity>>，按 createDT 倒序'},
  toolStorage:{m:'GET',p:'/layerTool/storageLayer',d:'成果入库到目标目录并上图',q:'id(任务ID)、targetId(目标目录ID)',r:'Result<String> "存储成功"',n:'行为：storage 置 1、成果图层 isShow=1、layerType=targetId'},
  toolDelete:{m:'GET',p:'/layerTool/delete',d:'删除任务记录',q:'id',r:'Result<boolean>'},
  tifInfo:{m:'GET',p:'/layerTool/getTifInfo',d:'读取栅格元信息（行列数 / 像元大小）',q:'layerId',r:'Result<ResamplingDTO>{xsize,ysize,xCell,yCell}',n:'xCell/yCell 已按 度×111319.5 折算为米'},
  cutLayer:{m:'POST',p:'/layerTool/cutLayer',d:'图层裁剪（异步）',q:'Body: LayerToolDto{layerId,layerName,detailJson,cutDto{wkt,lon,lat,distance}}',r:'Result<String> taskId',n:'origin=1 / taskType=1'},
  resample:{m:'POST',p:'/layerTool/resample',d:'栅格重采样（异步）',q:'Body: LayerToolDto.resamplingDto{xsize,ysize,xCell,yCell,resamplingMethod}',r:'Result<String> taskId',n:'origin=2；方法 nearest/bilinear(默认)/cubic/cubicspline/lanczos/average/mode'},
  tifToShp:{m:'POST',p:'/layerTool/tifToShp',d:'栅格矢量化：栅格 → 矢量',q:'Body: LayerToolDto{tifToShpDto{attributeName}}',r:'Result<String> taskId',n:'origin=3；uploadFileType=1'},
  shpToTif:{m:'POST',p:'/layerTool/shpToTif',d:'矢量栅格化：矢量 → 栅格',q:'Body: LayerToolDto.shpToTifDto{attributeName,x,y,height,width,type}',r:'Result<String> taskId',n:'origin=4；type 1 空间分辨率 / 2 网格大小'},
  reclass:{m:'POST',p:'/layerTool/reclassification',d:'栅格重分类（异步）',q:'Body: LayerToolDto.reclassificationDto{type,matrix}',r:'Result<String> taskId',n:'origin=5；matrix 是 JSON 字符串；type 1 分类{max,min,value} / 2 唯一值{old,value}'},
  erase:{m:'POST',p:'/layerTool/eraseVectorLayer',d:'矢量擦除（异步）',q:'Body: LayerToolDto',r:'Result<String> taskId',n:'origin=6'},
  buffer:{m:'POST',p:'/layerTool/bufferZone',d:'缓冲区分析（异步）',q:'Body: LayerToolDto.bufferZoneDto{bufferDistance}',r:'Result<String> taskId',n:'origin=7；单位米'},
  interUnion:{m:'POST',p:'/layerTool/intersectionAndUnion',d:'矢量交 / 并 / 补（异步）',q:'Body: LayerToolDto.intersectionAndUnionDto{layerIds[2],operationType}',r:'Result<String> taskId',n:'origin=8；须恰好 2 个图层且 dataType 一致；intersection / union / symDifference'},
  overlay:{m:'POST',p:'/layerTool/overlayCalculation',d:'栅格叠加计算（异步）',q:'Body: LayerToolDto.overlayCalculationDto{formulaList:[{dataType,value}]}',r:'Result<String> taskId',n:'origin=9；公式须含至少一个 dataType=layer'},

  /* ---- 拓扑检查 ---- */
  topoCheck:{m:'POST',p:'/topology/check',d:'执行拓扑检查（异步）',q:'Body: TopologyCheckDTO{layerId,rules[],srid,tolerance,minArea,…}',r:'Result<String> taskId',n:'origin=10；轮询 /topology/check/{taskId}'},
  topoReport:{m:'GET',p:'/topology/check/{taskId}',d:'轮询拓扑检查报告',q:'taskId(path)',r:'processing / failed / TopologyCheckReport',n:'status 取值 PASS / FAIL'},
  topoRules:{m:'GET',p:'/topology/rules',d:'取可用拓扑规则（19 条）',q:'geometryType(可选，按几何类型过滤)',r:'Result<List<Map<String,String>>>'},

   设计准则：一级域 = 一个后端聚合根 / 功能平面；二级页 = 该聚合根的一个生命周期阶段。

   └ 系统       DicDataType(5) + DicDataCode(6) + LayerLog(2)

  if(s.cls==='点'){
    const g={
      tri:`<polygon points="26,5 46,41 6,41" fill="${c}" opacity=".9" stroke="#fff" stroke-width="1.5"/>`,
      semi:`<path d="M6 40 A20 20 0 0 1 46 40 Z" fill="${c}" opacity=".9" stroke="#fff" stroke-width="1.5"/>`,
      fan:`<path d="M26 41 L8 12 A22 22 0 0 1 44 12 Z" fill="${c}" opacity=".9" stroke="#fff" stroke-width="1.5"/>`,
      station:`<rect x="9" y="14" width="34" height="24" rx="3" fill="${c}" opacity=".22" stroke="${c}" stroke-width="2"/><circle cx="26" cy="26" r="6" fill="${c}"/><path d="M26 6v8M18 10l3 5M34 10l-3 5" stroke="${c}" stroke-width="2" fill="none"/>`,
      house:`<path d="M26 7 L45 24 H39 V41 H13 V24 H7 Z" fill="${c}" opacity=".85" stroke="#fff" stroke-width="1.5"/>`
    };
    return `<svg width="52" height="46" viewBox="0 0 52 46">${g[s.shape]||g.tri}</svg>`;
  }
  if(s.cls==='线'){
    return `<svg width="56" height="20" viewBox="0 0 56 20"><path d="M2 16 Q 15 2, 28 12 T 54 6" fill="none" stroke="${c}" stroke-width="2.2" ${s.code.includes('dash')?'stroke-dasharray="6 3"':s.code.includes('0.8')?'stroke-width="1"':''}/></svg>`;
  }

/* 程序化底图：经纬网 + 等高线 + 河流 + 要素面 */
function baseMap(seed,opt={}){
  const w=100,h=100;
  const r=n=>{const x=Math.sin(seed*9301+n*49297)*233280;return x-Math.floor(x)};
  let grid='',cont='';
  for(let i=1;i<10;i++) grid+=`<path d="M${i*10} 0V100M0 ${i*10}H100" stroke="rgba(120,150,180,.20)" stroke-width=".25"/>`;
  for(let i=0;i<9;i++){
    const y=8+i*10+r(i)*5;
    cont+=`<path d="M0 ${y.toFixed(1)} C 25 ${(y-6-r(i+3)*5).toFixed(1)}, 45 ${(y+5).toFixed(1)}, 60 ${(y-2).toFixed(1)} S 88 ${(y+6).toFixed(1)}, 100 ${(y-3).toFixed(1)}" fill="none" stroke="rgba(150,130,100,.30)" stroke-width=".4"/>`;
  }
  const pts=[],n=8,cx=52,cy=55,rad=24+r(2)*8;
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2+r(i)*.32,rr=rad*(.72+r(i+11)*.5);pts.push(`${(cx+Math.cos(a)*rr*1.15).toFixed(1)},${(cy+Math.sin(a)*rr*.88).toFixed(1)}`)}
  return `<svg class="base" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="bg${seed}" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#eef4f9"/><stop offset="1" stop-color="#dfe9f2"/></linearGradient>
      <pattern id="pt${seed}" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M6 0H0v6" fill="none" stroke="rgba(160,185,210,.28)" stroke-width=".2"/></pattern>
    </defs>
    <rect width="${w}" height="${h}" fill="url(#bg${seed})"/>
    <rect width="${w}" height="${h}" fill="url(#pt${seed})"/>
    ${grid}${cont}
    <path d="M-2 72 C 20 66, 34 78, 54 70 S 84 62, 102 68" fill="none" stroke="rgba(70,150,205,.55)" stroke-width="1.1"/>
    <polygon points="${pts.join(' ')}" fill="${opt.fill||'rgba(26,156,120,.34)'}" stroke="${opt.stroke||'#1a9c78'}" stroke-width=".5"/>
  </svg>`;
}
function thumb(res,seed){
  const c=res.kind==='raster'?{fill:'rgba(192,125,22,.32)',stroke:'#c07d16'}:{fill:'rgba(26,156,120,.32)',stroke:'#1a9c78'};
  const glyph={vector:ICON.box,raster:ICON.grid,map:ICON.globe,style:ICON.palette}[res.kind]||ICON.layers;
  return baseMap(seed,c).replace('</svg>',`<g transform="translate(50 50)"><svg x="-9" y="-9" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c.stroke}" stroke-width="1.5" opacity=".85">${glyph}</svg></g></svg>`);
}

let apiOn=false;
function apiKeyList(){return [...new Set($$('[data-api]').map(e=>e.dataset.api).filter(k=>API[k]))]}
function annotate(root=document){
  const keys=apiKeyList();
  $$('[data-api]',root).forEach(el=>{
    const key=el.dataset.api; if(!key) return;
    el.querySelectorAll(':scope > .api-badge').forEach(b=>b.remove());
    el.classList.remove('api-el'); delete el.dataset.m;
    const a=API[key]; if(!a) return;
    el.classList.add('api-el'); el.dataset.m=a.m;
    const idx=keys.indexOf(key)+1;
    const b=document.createElement('i');
    b.className='api-badge'; b.textContent=idx;
    b.title=`【${idx}】${a.m} ${a.p}\n${a.d}\n入参：${a.q}\n返回：${a.r}${a.n?'\n注意：'+a.n:''}`;
    b.dataset.api=key;
    b.addEventListener('click',e=>{e.stopPropagation();openDock();setTimeout(()=>{
      const t=$(`.api-item[data-k="${key}"]`,$('#apiDockBody')); if(t) t.scrollIntoView({block:'center',behavior:'smooth'});
    },60)});
    el.appendChild(b);
  });
}
function openDock(){
  const keys=apiKeyList();
  $('#apiCount').textContent=keys.length; $('#apiCountTop').textContent=keys.length;
  $('#apiDockBody').innerHTML = keys.length? keys.map((k,i)=>{
    const a=API[k];
    return `<div class="api-item" data-k="${k}">
      <div class="hd"><span class="api-badge" style="position:static;display:inline-block;border:0">${i+1}</span>
      <span class="m ${a.m}">${a.m}</span><b>${esc(a.p)}</b></div>
      <div class="d">${esc(a.d)}</div>

      ${a.n?`<div class="note">注意：${esc(a.n)}</div>`:''}</div>`;
  }).join('') : '<div class="empty">当前页面未标注接口</div>';
  $('#apiDock').classList.add('show');
}

function bindTree(){

    state.treeSel=n; state.selId=null; render();

}

function polyPts(seed,i){
  const r=n=>{const x=Math.sin(seed*7919+n*104729)*233280;return x-Math.floor(x)};
  const n=7,cx=34+i*9,cy=40+i*6,rad=15+r(i)*7;
  return Array.from({length:n},(_,k)=>{
    const a=k/n*Math.PI*2+r(k)*.35, rr=rad*(.7+r(k+5)*.5);
    return `${(cx+Math.cos(a)*rr*1.2).toFixed(1)},${(cy+Math.sin(a)*rr*.9).toFixed(1)}`;
  }).join(' ');
}

function pageTasks(){
  const list=state.taskFilter==='all'?TASKS:TASKS.filter(t=>String(t.origin)===state.taskFilter);

  const rows=list.map(t=>{
    const st=t.st===0?['计算中','blue','b']:t.st===1?['成功','green','g']:['失败','red','r'];
    return `<tr>
      <td style="font-family:Consolas,monospace;font-size:11.5px">${esc(t.id)}</td>
      <td><span class="tag violet">${esc(ORIGIN[t.origin])}</span></td>

      <td style="min-width:132px">${t.st===0?`<div class="bar-mini"><i style="width:${t.prog}%"></i></div><span style="font-size:11px;color:var(--ink-3)">${t.prog}%</span>`:'—'}</td>
      <td>${t.st===1?`<span class="tag ${t.stored?'green':'orange'}">${t.stored?'已入库':'未入库'}</span>`:'—'}</td>
      <td>${esc(t.by)}</td><td>${esc(t.dt)}</td>
      <td style="white-space:nowrap">
        ${t.st===1&&!t.stored?`<button class="btn xs ok" data-api="toolStorage">成果入库</button>`:''}
        <button class="btn xs" data-api="toolList">日志</button>
        <button class="btn xs danger" data-api="toolDelete">删除</button></td></tr>`;
  }).join('');
  $('#view').innerHTML = pageHead('任务中心',`${list.length} 条任务 · 按 createDT 倒序`,
      `<button class="btn" data-api="toolList">${sv('refresh','1.8')}刷新</button>

        <button class="chip ${state.taskFilter==='all'?'on':''}" data-f3="all">全部</button>
        ${Object.keys(ORIGIN).map(k=>`<button class="chip ${state.taskFilter===k?'on':''}" data-f3="${k}">${esc(ORIGIN[k])}</button>`).join('')}
      </div></div>
      <div class="card" style="overflow:hidden">
        <div class="tbl-wrap"><table class="grid">
          <thead><tr><th>任务 ID</th><th>工具（origin）</th><th>源图层</th><th>状态</th><th>进度</th><th>成果</th><th>创建人</th><th>创建时间</th><th>操作</th></tr></thead>
          <tbody>${rows}</tbody></table></div>
        ${pager(list.length)}
      </div>
      <div class="footnote">任务列表 ← <code>GET /layerTool/getList?pageSize&amp;pageIndex&amp;origin</code>（Result&lt;IPage&lt;ToolHisEntity&gt;&gt;）· 删除 ← <code>GET /layerTool/delete?id</code> · 入库 ← <code>GET /layerTool/storageLayer?id&amp;targetId</code></div>`;
  $$('[data-f3]').forEach(el=>el.addEventListener('click',()=>{state.taskFilter=el.dataset.f3;render()}));
  annotate();

    <div class="modal-b">${body}</div>

  $('#modalRoot').appendChild(wrap);

function openTaskModal(title,steps){
  const m=modal({title:'任务执行 · '+title,width:530,
    body:`<div class="steps" id="steps">${steps.map((s,i)=>`<div class="step ${i===0?'now':''}" data-api="${s.api}">${esc(s.t)}</div>`).join('')}</div>

      <div style="display:flex;justify-content:space-between;margin-top:7px;font-size:12px;color:var(--ink-2)">
        <span id="ps">任务已提交，正在排队…</span><span id="pn">0%</span></div>
      <dl class="kv" style="margin-top:13px">
        <dt>任务 ID</dt><dd><code>task-20260316-8f3c</code></dd>
        <dt>轮询接口</dt><dd><code>GET /layerTool/getList?origin=N&amp;pageSize&amp;pageIndex</code></dd>
        <dt>实时推送</dt><dd>SignalR → IM 服务（imservice.imIP:imPort）</dd>
      </dl>`,
    footer:`<button class="btn cancel">后台运行</button><button class="btn" id="ok" disabled data-api="toolStorage">成果入库</button>`});
  let p=0,si=0;
  const bar=$('#pb',m.wrap),num=$('#pn',m.wrap),st=$('#ps',m.wrap);
  const timer=setInterval(()=>{
    p=Math.min(100,p+Math.random()*20+8);
    bar.style.width=p+'%'; num.textContent=Math.round(p)+'%';
    const s=Math.min(steps.length-1,Math.floor(p/100*steps.length));
    if(s!==si){si=s;$$('.step',m.wrap).forEach((el,i)=>{el.classList.toggle('now',i===si);el.classList.toggle('done',i<si)})}
    st.textContent = p<100? steps[si].t+' 执行中…' : '执行成功，可入库上图';
    if(p>=100){ clearInterval(timer); $$('.step',m.wrap).forEach(el=>el.classList.add('done'));
      st.textContent='执行成功'; st.style.color='#14775c';
      const b=$('#ok',m.wrap); b.disabled=false;
      b.addEventListener('click',()=>{toast('成果已入库（演示）· GET /layerTool/storageLayer?id&targetId'); m.close();});
    }
  },420);
  const obs=new MutationObserver(()=>{ if(!document.body.contains(m.wrap)){clearInterval(timer);obs.disconnect()} });
  obs.observe(document.body,{childList:true,subtree:true});
}

      <div class="form-row"><label>发布服务</label><div style="grid-column:2;display:flex;gap:12px;flex-wrap:wrap">
        ${['WMS','WFS','WMTS','WCS'].map((t,i)=>`<label style="display:flex;align-items:center;gap:5px;font-size:12.5px">
          <input type="checkbox" ${i<2?'checked':''}>${t}</label>`).join('')}</div></div>
      <div class="form-row"><label>默认样式</label><select class="select" data-api="styleList">${STYLES.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div>
      <div class="form-row"><label>切片缓存</label><div style="grid-column:2">
        <label style="display:flex;align-items:center;gap:5px;font-size:12.5px"><input type="checkbox">发布后立即创建 GeoWebCache 种子任务</label></div></div>
      <div class="hint" data-api="publishService">发布通过 <code>POST /serverInterface/publishService</code>（Body: LayerContentInputDto）调用 GeoServer REST API 完成。</div>`,
    footer:`<button class="btn cancel">取消</button><button class="btn primary" id="ok">发布</button>`});
  $('#ok',m.wrap).addEventListener('click',()=>{m.close();toast('已发布（演示）· POST /serverInterface/publishService');});
}
function openShpModal(){

    body:`<div class="form-row"><label>目标目录 ID</label><input class="input" placeholder="folderId（留空直接落 UploadFile/）"></div>
      <div class="dropzone" id="dz" data-api="shpUpload">${sv('up','1.6')}
        <div>一次性选择 .shp / .dbf / .shx / .prj 全部文件</div>
        <div style="font-size:11.5px;color:var(--ink-3);margin-top:3px">后端按 folderId 归档：{user.dir}/UploadFile/{folderId}/</div></div>
      <div id="fb" style="margin-top:10px"></div>
      <div class="hint">上传 <code>POST /Kneecoordinates/UploadShpFiles</code>（file[] + folderId，无类级前缀）→ 可选解析 <code>POST /Kneecoordinates/GetShpFileWKT</code>（folderId → 合并 WKT）。</div>`,
    footer:`<button class="btn cancel">取消</button><button class="btn primary" id="ok">开始上传</button>`});
  $('#dz',m.wrap).addEventListener('click',()=>{
    $('#fb',m.wrap).innerHTML=['chibizhen_hazard.shp','chibizhen_hazard.dbf','chibizhen_hazard.shx','chibizhen_hazard.prj']
      .map(f=>`<div class="pick">${sv('text','1.5')}<div class="fi"><div class="nm">${f}</div><div class="sz">已就绪</div></div><span class="tag green">待上传</span></div>`).join('');
  });
  $('#ok',m.wrap).addEventListener('click',()=>{m.close();openTaskModal('SHP 系列上传',[{t:'多文件上传',api:'shpUpload'},{t:'解析 WKT（可选）',api:'shpWkt'}]);});
}
function openPreviewModal(res){
  const st=STYLES.filter(s=>s.kind===res.kind);
  const lyr='sdms:'+res.id.toLowerCase();
  const host='http://192.168.10.58:8080/geoserver/sdms';
  const bbox='113.66,29.55,114.14,29.89';
  const m=modal({title:'服务预览 · '+res.name,width:780,
    body:`<div style="display:flex;gap:10px;margin-bottom:9px">
        <div class="form-row" style="flex:1;grid-template-columns:64px 1fr;margin:0"><label>渲染样式</label>
          <select class="select" id="pvStyle" data-api="styleList">${st.map(s=>`<option>${esc(s.name)}</option>`).join('')||'<option>（无匹配样式）</option>'}</select></div>
        <div class="form-row" style="flex:0 0 190px;grid-template-columns:64px 1fr;margin:0"><label>服务</label>
          <select class="select" id="pvType" data-api="serverInterface"><option>WMS</option><option>WMTS</option></select></div>
      </div>
      <div id="pvCanvas" style="border:1px solid var(--line);border-radius:7px;overflow:hidden;height:290px;position:relative;background:#e8eff6" data-api="serverInterface"></div>
      <div class="hint" id="pvUrl" style="margin-top:9px;word-break:break-all"></div>
      <div class="hint">服务地址由 <code>GET /serverInterface/getServerInterface?dataId&amp;serverType</code> 获取；样式切换即时反映到 <code>STYLES</code> 参数——样式经 <code>POST /dataStyle/InsertGeoServerStyle</code> 推送后即可在预览中生效。</div>`,
    footer:`<button class="btn cancel">关闭</button><button class="btn primary" id="ok" data-api="serverInterface">复制服务地址</button>`});
  const draw=()=>{
    const s=STYLES.find(x=>x.name===($('#pvStyle',m.wrap).value));
    const t=$('#pvType',m.wrap).value;
    const seed=res.id.charCodeAt(res.id.length-1)+7;
    const bands=s? s.ramp: ['#9db8cd'];
    const n=bands.length;
    const shapes=res.kind==='raster'
      ? (n>2
         ? Array.from({length:n},(_,i)=>`<rect x="0" y="${(160/n*i).toFixed(1)}" width="240" height="${(160/n).toFixed(1)}" fill="${bands[i]}" opacity=".78"/>`).join('')
         : `<defs><linearGradient id="pvg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${bands[0]}"/><stop offset="1" stop-color="${bands[n-1]}"/></linearGradient></defs><rect x="0" y="0" width="240" height="160" fill="url(#pvg)"/>`)
      : Array.from({length:Math.max(n,5)},(_,i)=>`<polygon points="${polyPts(seed+i,i)}" fill="${bands[i%n]}" opacity=".62" stroke="#ffffff" stroke-width="1"/>`).join('');
    $('#pvCanvas',m.wrap).innerHTML = baseMap(seed)
      + `<svg width="100%" height="100%" viewBox="0 0 240 160" preserveAspectRatio="none" style="position:absolute;inset:0">${shapes}</svg>`
      + (s?`<div style="position:absolute;left:9px;bottom:9px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:11px">
          <b style="display:block;margin-bottom:3px">${esc(s.name)} · ${esc(s.type)}${s.lv?' · '+s.lv+' 级':''}</b>
          <div style="display:flex;gap:2px">${s.ramp.map(c=>`<i style="width:16px;height:9px;background:${c};display:inline-block"></i>`).join('')}</div></div>`:'')
      + `<span class="tag blue" style="position:absolute;right:9px;top:9px">${t}</span>`;
    const u = t==='WMS'
      ? `${host}/wms?service=WMS&version=1.3.0&request=GetMap&LAYERS=${lyr}&STYLES=${s?encodeURIComponent(s.name):''}&CRS=EPSG:4326&BBOX=${bbox}&WIDTH=768&HEIGHT=512&FORMAT=image/png`
      : `${host}/gwc/service/wmts?SERVICE=WMTS&REQUEST=GetTile&LAYER=${lyr}&STYLE=${s?encodeURIComponent(s.name):''}&TILEMATRIX=EPSG:4326:10&TILEMATRIXSET=EPSG:4326&FORMAT=image/png`;
    $('#pvUrl',m.wrap).innerHTML='<b>GetMap / GetTile：</b><code>'+esc(u)+'</code>';
    $('#ok',m.wrap).onclick=()=>toast('已复制服务地址（演示）· GET /serverInterface/getServerInterface');
  };
  $('#pvStyle',m.wrap).addEventListener('change',draw);
  $('#pvType',m.wrap).addEventListener('change',draw);
  draw();
}

function openSymbolModal(s){
  const m=modal({title:s?'符号详情 · '+s.name:'新增符号',width:520,
    body:`<div class="form-row"><label>符号名称</label><input class="input" value="${esc(s?s.name:'')}" placeholder="symbolName"></div>
      <div class="form-row"><label>符号类别</label><select class="select"><option ${s&&s.cls==='点'?'selected':''}>点</option><option ${s&&s.cls==='线'?'selected':''}>线</option><option ${s&&s.cls==='面'?'selected':''}>面</option></select></div>
      <div class="form-row"><label>载体类型</label><select class="select"><option ${s&&s.typ==='字体'?'selected':''}>字体</option><option ${s&&s.typ==='图片'?'selected':''}>图片</option><option ${s&&s.typ==='线型'?'selected':''}>线型</option><option ${s&&s.typ==='填充'?'selected':''}>填充</option></select></div>
      <div class="form-row"><label>Unicode / 路径</label><input class="input" value="${esc(s?s.code:'')}"></div>
      <div class="form-row"><label>颜色</label><input class="input" value="${esc(s?s.color:'#1163b5')}"></div>
      <div class="form-row"><label>字号 / 角度</label><div style="display:flex;gap:7px"><input class="input" placeholder="fontSize"><input class="input" placeholder="fontAngle"></div></div>
      <div class="hint" data-api="symbolInsert">实体表 <code>sdms_symbol</code>；字段含 <code>imageorFontType/path/imagelong/imageWide/fontFamily/charUnicode</code> 等。</div>`,
    footer:`<button class="btn cancel">关闭</button>${s?`<button class="btn danger" data-api="symbolDelete">删除</button>`:`<button class="btn primary" data-api="symbolInsert">保存</button>`}`});
}
function openM3dModal(){
  const m=modal({title:'上传三维数据',width:600,
    body:`<div class="form-sec">① 类型与源格式</div>
      <div class="form-row"><label>数据名称<span class="req">*</span></label><input class="input" placeholder="name"></div>
      <div class="form-row"><label>数据类型<span class="req">*</span></label>
        <select class="select" id="mt"><option value="OSGB">OSGB 倾斜摄影</option><option value="POINTCLOUD">POINTCLOUD 点云</option>
          <option value="SINGLE">SINGLE 单体模型</option><option value="BIM">BIM 模型</option><option value="TILESET">TILESET 现成 3D Tiles</option></select></div>
      <div class="form-row"><label>源格式<span class="req">*</span></label>
        <select class="select" id="sf"><option value="osgb">osgb</option><option value="laz">las / laz</option><option value="obj">obj / fbx</option><option value="ifc">ifc</option><option value="tileset">tileset</option></select></div>
      <div class="form-row"><label>目标目录</label><select class="select" data-api="layerTree"><option>三维资源库</option><option>空间数据 / 结果空间数据</option></select></div>
      <div class="form-row"><label>SRID</label><input class="input" value="4326"></div>
      <div class="form-sec" style="margin-top:6px">② 上传分片</div>
      <div class="dropzone" id="dz" data-api="m3dPart">${sv('cube','1.6')}
        <div>点击或拖拽三维数据包</div>
        <div style="font-size:11.5px;color:var(--ink-3);margin-top:3px">非最后分片必须 ≥ 5 MiB（对象存储 compose 限制）</div></div>
      <div id="fb" style="margin-top:8px"></div>
      <div class="hint">modelType 与 srcFormat 必须匹配，否则 <code>/model3d/init</code> 直接校验失败。TILESET 类型免转换，完成上传即 PUBLISHED。</div>`,
    footer:`<button class="btn cancel">取消</button><button class="btn primary" id="ok">初始化并上传</button>`});
  $('#dz',m.wrap).addEventListener('click',()=>{
    $('#fb',m.wrap).innerHTML=`<div class="pick">${sv('cube','1.5')}<div class="fi"><div class="nm">chibi_osgb.zip</div>
      <div class="sz">2.8 GB · 560 片 × 5 MiB</div></div><span class="tag blue">待上传</span></div>`;
  });
  $('#ok',m.wrap).addEventListener('click',()=>{m.close();
    openTaskModal('三维转换',[{t:'初始化 init',api:'m3dInit'},{t:'分片上传 part',api:'m3dPart'},{t:'完成 complete',api:'m3dComplete'},{t:'转换 convert',api:'m3dConvert'}]);});
}
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}

/* ========================= 路由 ========================= */
const ROUTES={
  '#/data':()=>pageCatalog('all'),
  '#/ingest':pageIngest,
  '#/model3d':page3d,
  '#/catalog/type':()=>pageTaxonomy('type'),
  '#/catalog/tag':()=>pageTaxonomy('tag'),
  '#/catalog/tagrel':()=>pageTaxonomy('tagrel'),
  '#/style':pageStyle,
  '#/symbol':pageSymbol,
  '#/publish':pagePublish,
  '#/tools':()=>pageTools(),
  '#/tools/topology':()=>pageTools('topology'),
  '#/tasks':pageTasks,
  '#/system/dict':pageDict,
  '#/system/log':pageLog
};
function render(){
  if(!ROUTES[state.route]) state.route='#/data';
  renderNav();
  ROUTES[state.route]();
  if(apiOn) openDock();
}
window.addEventListener('hashchange',()=>{ state.route=location.hash||'#/data'; state.selId=null; render(); });

/* ========================= 启动 ========================= */
initTop();
if(!location.hash) location.hash='#/data';
render();
</script>
