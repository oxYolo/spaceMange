# =====================================================================
# 三维成果加载：nginx 反向代理 MinIO 参考配置
#
# 用途：为 3D Tiles 提供「整目录可访问 + CORS」的加载入口，
#       解决预签名 URL 无法覆盖相对路径子瓦片导致的 403 问题。
#
# 配套服务端配置（bootstrap-dev.yml）：
#   geodata.model3d.storage.public-read: true
#   geodata.model3d.storage.public-read-prefix: model3d/
#   geodata.model3d.storage.public-base-url: https://gis.example.com   # 即本 server 的对外地址
#
# 对应关系：/{bucket}/{key} —— public-base-url 不含 bucket，由本代理拼接。
# 例：https://gis.example.com/geodata/model3d/<id>/publish/tileset.json
# =====================================================================

server {
    listen 443 ssl;
    server_name gis.example.com;

    # ssl_certificate     /etc/nginx/certs/gis.example.com.crt;
    # ssl_certificate_key /etc/nginx/certs/gis.example.com.key;

    # 3D Tiles 瓦片普遍较大，放宽 body 与大文件超时
    client_max_body_size 0;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    location /geodata/ {
        # 指向 MinIO（内部地址），路径原样透传：/geodata/<key> → MinIO /geodata/<key>
        proxy_pass http://127.0.0.1:9000/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # —— CORS：Cesium 需跨域读取 tileset.json 与子瓦片 ——
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type, Accept, Origin" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # 成果为只读内容，可长缓存（按文件指纹变更时刷新）
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}

# —— 需要访问鉴权时的做法（可选）——
# 不要在 MinIO 层退回逐文件签名（会重新踩相对路径 403 的坑）。
# 改为在 nginx 用 auth_request 校验 token，通过后再代理到 MinIO：
#
#   location = /auth { internal; proxy_pass http://geodata-service:8982/model3d/authorize; }
#   location /geodata/ { auth_request /auth; proxy_pass http://127.0.0.1:9000/; ... }
